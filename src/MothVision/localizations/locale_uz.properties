moth_vision.weapon.chained_dagger.action_miss=⛓|{0}ning zanjiri {1}ga uradi, lekin almashinuv chiqmadi!
moth_vision.weapon.guitar.name=Gitara
moth_vision.weapon.guitar.description=Yaqin jang, 4 kub, 2 aniqlik, 2 energiya, zarar bonusi yo'q. Faol qobiliyat — Feedback (4 energiya, undan kam bilan ishlatib bo'lmaydi, 5 yurish sovish): dushmanni tanlaydi; agar u shu yurishda hujum qilsa, zarar bekor qilinadi va shu qurol bilan + bloklangan zarar bonus sifatida javob zarbasi beriladi. Agar sizga uning maxsus hujumlaridan biri tekkan bo'lsa (oddiy zarba emas), siz ham unga qarshi shu hujumning bepul nusxasini olasiz. Agar dushman sizga hujum qilmagan bo'lsa, Feedback oddiy hujumga aylanadi.
moth_vision.weapon.guitar.feedback.name=Feedback
moth_vision.weapon.guitar.feedback.text=🎸|{0} {1}ga javob berishga tayyorlanmoqda!
moth_vision.weapon.guitar.feedback.effect=🎸|{0} {1}ga qarshi hujum qaytardi!
moth_vision.weapon.guitar.feedback.effect_reflect=🎸|{0} {1}ga qarshi hujum qaytardi va uning o'z harakatini unga qarshi ishlatdi!
moth_vision.skill.clock_o_destiny.name=Taqdir soati
moth_vision.skill.clock_o_destiny.description=Jangdagi hammani, o'zingiz ham qo'shilgan holda, tasodifiy 7-10 yurishga vaqtda muzlatish uchun faollashtiring. 17 yurish sovish.
moth_vision.skill.clock_o_destiny.action.name=Qum soatini aylantirish
moth_vision.skill.clock_o_destiny.text=⏳|{0} qum soatini aylantirdi! Hamma {1} yurishga vaqtda muzlab qoldi.
moth_vision.skill.embargo.name=Embargo
moth_vision.skill.embargo.description=Siz o'zingizniki ishlatmaguningizcha dushmanlar buyum ishlata olmaydi. Agar dushmanda ham Embargo bo'lsa, bu qobiliyat ta'sir qilmaydi.
moth_vision.skill.embargo.lifted=🚫|{0} buyum ishlatib, savdo embargosini bekor qildi!
moth_vision.skill.fight_or_flight.name=Jang yoki qochish
moth_vision.skill.fight_or_flight.description=1 energiya va yurishingizga tushadi, 5 yurish sovish. Bitta dushmanni kuzating: agar u sizga hujum qilsa va siz chetlana olsangiz, chetlanishga majbur bo'lasiz (yoki Chetlanish sovishda bo'lsa, kuchsizroq himoya reaktsiyasi qilasiz); aks holda unga qarshi hujumga majbur bo'lasiz.
moth_vision.skill.fight_or_flight.action.name=Kuzatish
moth_vision.skill.fight_or_flight.text=👁|{0}ning ko'z qorachiqlari kengayib, {1}ning har bir harakatini kuzatmoqda.
moth_vision.skill.fight_or_flight.weak_roll=💨|{0} chetlanishga ulgurmay, o'rniga qaltirab, zarbaga tayyorlanmoqda!
moth_vision.skill.barbeque.name=Barbekyu
moth_vision.skill.barbeque.description=20 yurish sovushi. Dushmanni tanlang va olib kelgan grilda u bilan sersuv, yangi barbekyudan bahramand bo'ling. Ikkovingizni ham 5 yurishga karaxt qiladi, lekin har yurishda 1 HP va 1 energiya tiklaydi.
moth_vision.skill.barbeque.action.name=Barbekyu
moth_vision.skill.barbeque.text=🍖|{0} gril yoqib, {1}ni sersuv, yangi barbekyuga taklif qiladi! Ikkovi ham 5 yurishga karaxt bo'ladi.
moth_vision.skill.barbeque.tick=🍖|{0} barbekyudan zavqlanib, 1 HP va 1 energiya tiklaydi.
moth_vision.skill.lobotomy.name=Lobotomiya
moth_vision.skill.lobotomy.description=O'zingizga yoki ittifoqchingizga zudlik bilan ishlatiladigan Ignani beradi. Nishon hujum energiyasi narxini abadiy 1 ga yo'qotadi, ammo doim hujum qilishga (yoki energiyasi bo'lmasa, qayta zaryadlashga) majbur bo'ladi va uning hujumlari tasodifiy dushmanga yo'naltiriladi — agar yetib bo'ladigan dushman bo'lmasa, o'ziga.
moth_vision.item.needle.name=Igna
moth_vision.item.needle.text=🪛|{0} miyasini kulgili tarzda qayta simlaydi.
moth_vision.item.needle.text_self=💉|{0} ignani o'ziga sanchdi!
moth_vision.weapon.mimicry.name=Mimikriya
moth_vision.weapon.mimicry.description=Yaqin jang, 2-3 zarar, 2 aniqlik, 2 energiya. Har 3-zarba nishonni yiqitadi va 25% ehtimol bilan qon ketishga sabab bo'ladi (hisoblagich faqat qayta zaryadlashda tiklanadi). Onrush: uzoqdagi dushmanga tashlanib +2 zarar bilan zarba beradi (3 energiya, 5 yurish sovish, o'tmasa o'zini 1 yurishga karaxt qiladi). Great Split: Vertical: 1 yurish tayyorgarlikdan so'ng +4 qo'shimcha zarar bilan zarba berib, nishonni 1 yurishga karaxt qiladi (5 energiya, 5 yurish sovish, o'tmasa o'zini 2 yurishga karaxt qiladi). Ushbu qurol bilan jami 25 zarar yetkazilgach E.G.O. ochiladi: 4 yurishga 2 zirh beradi, har yo'qotilgan HP bilan uzayadi va kuchayadi, hamda Great Split: Horizontal ni ochadi — 2 dushmanga zarba berib, har biriga 18 zarar va qon ketish qo'shadi (5 energiya, 15 yurish sovish, o'tmagan zarbalar soniga qarab o'zini 6 yurishgacha karaxt qiladi).
moth_vision.weapon.mimicry.knockdown=🥊|{0} {1}ni {2}-zarbali kombo bilan yiqitdi!
moth_vision.weapon.mimicry.onrush.name=Onrush
moth_vision.weapon.mimicry.onrush.hit=💨|{0} {1}gacha bo'lgan masofani tezda qisqartirib, unga urildi! {2} zarar yetkazildi.
moth_vision.weapon.mimicry.onrush.miss=💨|{0} {1}gacha bo'lgan masofani tezda qisqartirdi, lekin zarba butunlay o'tib ketdi va {0} qoqildi!
moth_vision.weapon.mimicry.horizontal.warning=⚠️|{0} hozir ag'dar-to'ntar zarbani boshidan kechiradi!
moth_vision.weapon.turbo_gloves.name=Turbo-qo'lqoplar
moth_vision.weapon.turbo_gloves.description=Yaqin jang, 3 kub, 2 aniqlik, 2 energiya. Qo'l bog'lamining Kombosi, lekin 2 o'rniga 3 yurish davom etadi (+1 kub har 2 to'plamga, +1 energiya/yurish, har zarbada yangilanadi) va zaifroq Mis boldiriq effekti (qayta zaryadlanayotgan nishonga tegish 3 energiyani so'radi). Kombo boshqa birov ham ushbu qurolning oxirgi nishoniga tegsa ham ortadi. Uppercut (1 energiya, 6 yurish sovish): har 2 o'rniga har bir kombo to'plami uchun kub qo'shadi, tegsa har to'plam uchun 10% karaxt qilish ehtimoli. Punch Barrage (1 energiya, 6 yurish sovish): har kombo to'plami uchun 1-2 zararli bitta musht uradi.
