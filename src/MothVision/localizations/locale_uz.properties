moth_vision.weapon.chained_dagger.name=Zanjirli hanjar
moth_vision.weapon.chained_dagger.description=Yaqindan uradigan qurol. Maxsus zarbasi masofadan uradi va qurolingizni nishon quroli bilan almashtirishi mumkin — ehtimol nishonning yetishmayotgan energiyasiga qarab oshadi, qayta zaryadlanayotganda kafolatlangan. 3 yurish sovushi.
