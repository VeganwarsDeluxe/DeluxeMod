moth_vision.weapon.pen.name=Stylo
moth_vision.weapon.pen.description=Corps à corps, 3 cubes, 2 précision, 2 énergie, aucun bonus de dégâts. Restaure de l'énergie lorsque les dégâts infligés et reçus sont égaux.
moth_vision.weapon.pen.text=🖊|{0} équilibre l'échange avec {1}.
