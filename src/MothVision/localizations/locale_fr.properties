moth_vision.state.aflame.cauterize=🔥|La chaleur cautérise la plaie de {0}, arrêtant le saignement !
moth_vision.weapon.guitar.name=Guitare
moth_vision.weapon.guitar.description=Corps à corps, 4 cubes, 2 précision, 2 énergie, aucun bonus de dégâts. Actif — Feedback (4 énergie, inutilisable en dessous, recharge de 5 tours) : cible un ennemi ; s'il vous attaque ce tour-ci, annule les dégâts et riposte avec cette arme + les dégâts bloqués en bonus. Si ce qui vous a touché était une de ses attaques spéciales (pas un coup basique), vous obtenez aussi une copie gratuite de cette attaque contre lui. S'il ne vous attaque pas, Feedback devient une attaque basique.
moth_vision.weapon.guitar.feedback.name=Feedback
moth_vision.weapon.guitar.feedback.text=🎸|{0} se prépare à répondre à {1} !
moth_vision.weapon.guitar.feedback.effect=🎸|{0} contre {1} !
moth_vision.weapon.guitar.feedback.effect_reflect=🎸|{0} contre {1} et retourne sa propre technique contre lui !
moth_vision.skill.clock_o_destiny.name=Horloge du destin
moth_vision.skill.clock_o_destiny.description=Activez pour figer tout le monde dans le temps, vous y compris, pendant 7 à 10 tours aléatoires. Recharge de 17 tours.
moth_vision.skill.clock_o_destiny.action.name=Retourner le sablier
moth_vision.skill.clock_o_destiny.text=⏳|{0} retourne le sablier ! Tout le monde est figé dans le temps pendant {1} tours.
moth_vision.skill.embargo.name=Embargo
moth_vision.skill.embargo.description=Les ennemis ne peuvent pas utiliser d'objets tant que vous n'avez pas utilisé l'un des vôtres. Si un ennemi possède aussi Embargo, la compétence n'a aucun effet.
moth_vision.skill.embargo.lifted=🚫|{0} utilise un objet, levant l'embargo commercial !
moth_vision.skill.fight_or_flight.name=Combat ou fuite
moth_vision.skill.fight_or_flight.description=Coûte 1 énergie et votre tour, recharge de 5 tours. Suivez un ennemi : s'il vous attaque et que vous pouvez esquiver, vous êtes forcé d'esquiver (ou de faire une réaction défensive plus faible si l'esquive est en recharge) ; sinon, vous êtes forcé de le contre-attaquer.
moth_vision.skill.fight_or_flight.action.name=Traquer
moth_vision.skill.fight_or_flight.text=👁|Les pupilles de {0} se dilatent, suivant chaque mouvement de {1}.
moth_vision.skill.fight_or_flight.weak_roll=💨|{0} n'a pas le temps d'esquiver et se crispe à la place, se préparant au coup !
moth_vision.skill.lobotomy.name=Lobotomie
moth_vision.skill.lobotomy.description=Donne une Aiguille utilisable instantanément sur vous-même ou un allié. La cible perd définitivement 1 en coût d'énergie d'attaque, mais est forcée d'attaquer en permanence (ou de recharger, si elle n'a plus d'énergie), et ses attaques sont redirigées vers un ennemi aléatoire — elle-même si aucun n'est à portée.
moth_vision.item.needle.name=Aiguille
moth_vision.item.needle.text=🪛|{0} reprogramme son cerveau d'une drôle de façon.
moth_vision.item.needle.text_self=💉|{0} se plante l'aiguille !
moth_vision.weapon.mimicry.name=Mimétisme
moth_vision.weapon.mimicry.description=Corps à corps, 2-3 dégâts, 2 précision, 2 énergie. Chaque 3e coup met la cible à terre et a 25% de chances de causer un saignement (le compteur ne se réinitialise qu'au rechargement). Onrush : fonce et frappe un ennemi éloigné pour +2 dégâts (3 énergie, recharge 5 tours, s'étourdit 1 tour en cas d'échec). Great Split : Vertical : se charge 1 tour, puis frappe pour +4 dégâts bonus et étourdit la cible 1 tour (5 énergie, recharge 5 tours, s'étourdit 2 tours en cas d'échec). Après 25 dégâts cumulés avec cette arme, E.G.O. devient disponible : accorde 2 armure pendant 4 tours, prolongée et renforcée à chaque point de vie perdu, et débloque Great Split : Horizontal — une frappe chargée touchant 2 ennemis pour 18 dégâts chacun plus saignement (5 énergie, recharge 15 tours, s'étourdit jusqu'à 6 tours selon le nombre d'échecs).
moth_vision.weapon.mimicry.knockdown=🥊|{0} met {1} à terre avec un combo de {2} coups !
moth_vision.weapon.mimicry.onrush.name=Onrush
moth_vision.weapon.mimicry.onrush.hit=💨|{0} referme rapidement la distance avec {1} et le percute ! {2} dégâts infligés.
moth_vision.weapon.mimicry.onrush.miss=💨|{0} referme rapidement la distance avec {1}, mais la percussion rate complètement et {0} trébuche !
moth_vision.weapon.mimicry.horizontal.warning=⚠️|{0} vont subir un coup dévastateur !
moth_vision.weapon.turbo_gloves.name=Turbo-Gants
moth_vision.weapon.turbo_gloves.description=Corps à corps, 3 cubes, 2 précision, 2 énergie. Combo du Bandage de main, mais durant 3 tours au lieu de 2 (+1 dé tous les 2 stacks, +1 énergie/tour, se renouvelle à chaque coup) plus un effet Coup-de-poing américain affaibli (toucher une cible en rechargement lui draine 3 énergie). Le Combo augmente aussi quand quelqu'un d'autre touche la dernière cible de cette arme. Uppercut (1 énergie, recharge de 6 tours) : ajoute un dé par stack de Combo au lieu de tous les 2, 10% de chance par stack d'étourdir en cas de coup. Punch Barrage (1 énergie, recharge de 6 tours) : lance un coup de 1-2 dégâts par stack de Combo.
moth_vision.weapon.turbo_gloves.combo_start=⬆️💥|{0} enchaîne les coups !
moth_vision.weapon.turbo_gloves.combo_continue=⬆️💥|{0} poursuit son combo de {1} coups !
moth_vision.weapon.turbo_gloves.combo_end=⛔️|Le combo de {1} coups de {0} se termine.
moth_vision.weapon.turbo_gloves.reload_punish=🥊|{0} se fait surprendre en plein rechargement et trébuche !
moth_vision.weapon.turbo_gloves.uppercut.name=Uppercut
moth_vision.weapon.turbo_gloves.uppercut.stun=💥|L'uppercut de {0} sonne {1} et l'étourdit !
moth_vision.weapon.turbo_gloves.barrage.name=Punch Barrage
moth_vision.weapon.turbo_gloves.barrage.text=👊|{0} déchaîne une salve de {2} coups sur {1} !
moth_vision.weapon.turbo_gloves.block.name=Blocage
moth_vision.weapon.turbo_gloves.block.text=✋|{0} se prépare à bloquer un coup !
moth_vision.weapon.turbo_gloves.block.text_targeted=✋|{0} se prépare à bloquer pour {1} !
moth_vision.weapon.turbo_gloves.block.effect=✋|{0} bloque le coup et en profite !
moth_vision.weapon.turbo_gloves.block.vain=⛔️|Le blocage de {0} n'a servi à rien — le combo s'effondre.
moth_vision.weapon.wooden_log.name=Bûche
moth_vision.weapon.wooden_log.description=Corps à corps, 2-5 dégâts, 0 précision, 3 énergie. 35% de chances de déséquilibrer la cible en cas de coup réussi. En cas d'échec total, 50% de chances de vous déséquilibrer vous-même.
moth_vision.weapon.wooden_log.knockdown=🪵|{0} frappe {1} avec la bûche et le déséquilibre !
moth_vision.weapon.wooden_log.stumble=🪵|{0} frappe dans le vide, rate son coup et perd l'équilibre !
moth_vision.weapon.mimicry.vertical.name=Great Split : Vertical
moth_vision.weapon.mimicry.vertical.charge=⚔️|{0} prépare une frappe verticale sur {1} !
moth_vision.weapon.mimicry.horizontal.name=Great Split : Horizontal
moth_vision.weapon.mimicry.horizontal.charge=⚔️|{0} prépare une frappe horizontale balayante !
moth_vision.weapon.mimicry.ego.name=E.G.O.
moth_vision.weapon.mimicry.ego.text=🩸|{0} libère son E.G.O. ! L'armure s'intensifie, réagissant à chaque blessure.
moth_vision.weapon.mimicry.ego_end=🩸|L'E.G.O. de {0} s'estompe.
moth_vision.item.flare.name=Fusée éclairante
moth_vision.item.flare.text_ally=🔦|{0} déclenche une fusée éclairante au-dessus de {1}. Quelque chose approche.
moth_vision.item.flare.granted=🎁|{0} trouve : {1} !
moth_vision.item.flare.text_enemy=🔦|{0} touche {1} avec une fusée éclairante, l'enflamme et lui grille les nerfs !
moth_vision.weapon.hand_bandage.name=Bandage de main
moth_vision.weapon.hand_bandage.description=Corps à corps, 1-3 dégâts, 2 précision, 2 énergie. Chaque coup déclenche ou prolonge un Combo : tant qu'il est actif, vous gagnez +1 dé d'attaque (plus un dé supplémentaire tous les 2 combos) et +1 énergie à la fin de chaque tour. Le Combo dure 2 tours et se renouvelle à chaque coup.
moth_vision.state.combo.start=💥|{0} commence son combo !
