moth_vision.state.aflame.cauterize=🔥|Жар припікає рану {0}, зупиняючи кровотечу!
moth_vision.weapon.chained_dagger.name=Кинджал на ланцюгу
moth_vision.weapon.chained_dagger.description=Зброя ближнього бою. Спецатака дальнобійна і може обміняти вашу зброю зі зброєю цілі — шанс зростає з нестачею енергії цілі, гарантований під час перезарядки. Відкат 3 ходи.
moth_vision.weapon.chained_dagger.action.name=Обмін
moth_vision.weapon.chained_dagger.action.text=⛓|{0} смикає ланцюг, обмінюючись зброєю з {1}!
moth_vision.weapon.chained_dagger.action_miss=⛓|Ланцюг {0} хльостає по {1}, але обмін не вдався!
moth_vision.weapon.guitar.name=Гітара
moth_vision.weapon.guitar.description=Ближній бій, 4 куби, 2 точності, 2 енергії, без бонусу шкоди. Активність — Фідбек (4 енергії, не можна використати при меншому запасі, відкат 5 ходів): обирає ворога; якщо той атакує цього ходу, шкода обнуляється і завдається у відповідь удар цією зброєю + заблокована шкода як бонус. Якщо по вам влучили однією з його особливих атак (не звичайним свінгом), ви також отримуєте безкоштовну копію цієї атаки проти нього. Якщо ворог вас не атакував, Фідбек стає звичайною атакою.
moth_vision.weapon.guitar.feedback.name=Feedback
moth_vision.weapon.guitar.feedback.text=🎸|{0} готується відповісти {1}!
moth_vision.weapon.guitar.feedback.effect=🎸|{0} контратакує {1}!
moth_vision.weapon.guitar.feedback.effect_reflect=🎸|{0} контратакує {1} і використовує проти нього його ж прийом!
moth_vision.skill.clock_o_destiny.name=Годинник долі
moth_vision.skill.clock_o_destiny.description=Активуйте, щоб заморозити в часі всіх учасників бою, включно з собою, на випадкові 7-10 ходів. Відкат 17 ходів.
moth_vision.skill.clock_o_destiny.action.name=Перевернути пісочний годинник
moth_vision.skill.clock_o_destiny.text=⏳|{0} перевертає пісочний годинник! Усі застигають у часі на {1} ходів.
moth_vision.skill.embargo.name=Ембарго
moth_vision.skill.embargo.description=Вороги не можуть використовувати предмети, поки ви не використаєте свій. Якщо у ворога теж є Ембарго, здібність не діє.
moth_vision.skill.embargo.lifted=🚫|{0} використовує предмет, знімаючи торгове ембарго!
moth_vision.skill.fight_or_flight.name=Бий або біжи
moth_vision.skill.fight_or_flight.description=Коштує 1 енергію та ваш хід, відкат 5 ходів. Відстежуйте одного ворога: якщо він атакує вас і ви можете ухилитися, вас змусить ухилитися (або здійснити слабшу захисну реакцію, якщо ухилення на відкаті); інакше вас змусить контратакувати його.
moth_vision.skill.fight_or_flight.action.name=Відстежити
moth_vision.skill.fight_or_flight.text=👁|Зіниці {0} розширюються, відстежуючи дії {1}.
moth_vision.skill.fight_or_flight.weak_roll=💨|{0} не встигає ухилитися і замість цього здригається, готуючись до удару!
moth_vision.skill.barbeque.name=Барбекю
moth_vision.skill.barbeque.description=Відкат 20 ходів. Оберіть ворога і влаштуйте з ним соковите свіже барбекю на принесеному грилі. Оглушує вас обох на 5 ходів, але щохода відновлює 1 ХП та 1 енергію.
moth_vision.skill.barbeque.action.name=Барбекю
moth_vision.skill.barbeque.text=🍖|{0} розпалює гриль і запрошує {1} на соковите свіже барбекю! Обидва оглушені на 5 ходів.
moth_vision.skill.barbeque.tick=🍖|{0} насолоджується барбекю, відновлюючи 1 ХП та 1 енергію.
moth_vision.skill.lobotomy.name=Лоботомія
moth_vision.skill.lobotomy.description=Дає Голку, яку можна миттєво застосувати на себе або союзника. Ціль назавжди втрачає 1 енергію вартості атаки, але змушена завжди атакувати (або перезаряджатися, якщо немає енергії), а її атака спрямовується на випадкового ворога — на себе, якщо ворогів у межах досяжності немає.
moth_vision.item.needle.name=Голка
moth_vision.item.needle.text=🪛|{0} кумедно перепрошиває собі мізки.
moth_vision.item.needle.text_self=💉|{0} встромляє голку у себе!
moth_vision.weapon.mimicry.name=Мімікрія
moth_vision.weapon.mimicry.description=Ближній бій, 2-3 шкоди, 2 точності, 2 енергії. Кожен 3-й удар збиває ціль з ніг і з 25% шансом викликає кровотечу (лічильник скидається лише перезарядкою). Onrush: ривок до далекого ворога з ударом +2 шкоди (3 енергії, відкат 5 ходів, при промаху оглушує себе на 1 хід). Great Split: Vertical: замах на 1 хід, потім удар з +4 бонусної шкоди й оглушенням цілі на 1 хід (5 енергії, відкат 5 ходів, при промаху оглушує себе на 2 ходи). Після 25 сумарної шкоди цією зброєю стає доступний E.G.O.: дає 2 броні на 4 ходи, продовжується і посилюється з кожним втраченим HP, і відкриває Great Split: Horizontal — заряджений удар по 2 ворогах, по 18 шкоди кожному плюс кровотеча (5 енергії, відкат 15 ходів, оглушує себе до 6 ходів залежно від кількості промахів).
moth_vision.weapon.mimicry.knockdown=🥊|{0} збиває {1} з ніг комбо з {2} ударів!
moth_vision.weapon.mimicry.onrush.name=Onrush
moth_vision.weapon.mimicry.onrush.hit=💨|{0} стрімко скорочує дистанцію до {1} і таранить його! Завдано {2} шкоди.
moth_vision.weapon.mimicry.onrush.miss=💨|{0} стрімко скорочує дистанцію до {1}, але таран повністю проходить повз, і {0} спотикається!
moth_vision.weapon.mimicry.horizontal.warning=⚠️|{0} зараз відчують на собі нищівний удар!
moth_vision.weapon.turbo_gloves.name=Турбо-рукавички
moth_vision.weapon.turbo_gloves.description=Ближній бій, 3 куби, 2 точності, 2 енергії. Комбо від Пов'язки на руку, але триває 3 ходи замість 2 (+1 кубик за кожні 2 стеки, +1 енергія за хід, оновлюється при кожному влучанні), плюс слабший ефект Кастета (влучання по цілі, що перезаряджається, знімає 3 енергії). Комбо також росте, якщо хтось інший влучає в останню ціль цієї зброї. Uppercut (1 енергія, відкат 6 ходів): дає кубик за кожен стек комбо замість кожних двох, 10% шанс оглушити за кожен стек при влучанні. Punch Barrage (1 енергія, відкат 6 ходів): завдає один удар 1-2 шкоди за кожен стек комбо.
moth_vision.weapon.turbo_gloves.combo_start=⬆️💥|{0} починає серію ударів!
moth_vision.weapon.turbo_gloves.combo_continue=⬆️💥|{0} продовжує серію комбо з {1} ударів!
moth_vision.weapon.turbo_gloves.combo_end=⛔️|Серія комбо {0} з {1} ударів завершується.
moth_vision.weapon.turbo_gloves.reload_punish=🥊|{0} застигнутий зненацька під час перезарядки і спотикається!
moth_vision.weapon.turbo_gloves.uppercut.name=Uppercut
moth_vision.weapon.turbo_gloves.uppercut.stun=💥|Аперкот {0} оглушує {1}!
moth_vision.weapon.turbo_gloves.barrage.name=Punch Barrage
moth_vision.weapon.turbo_gloves.barrage.text=👊|{0} обрушує на {1} серію з {2} ударів!
moth_vision.weapon.turbo_gloves.block.name=Блок
moth_vision.weapon.turbo_gloves.block.text=✋|{0} готується заблокувати удар!
moth_vision.weapon.turbo_gloves.block.text_targeted=✋|{0} готується прикрити блоком {1}!
moth_vision.weapon.turbo_gloves.block.effect=✋|{0} блокує удар і використовує момент!
moth_vision.weapon.turbo_gloves.block.vain=⛔️|Блок {0} не знадобився — комбо зривається.
moth_vision.weapon.wooden_log.name=Колода
moth_vision.weapon.wooden_log.description=Ближній бій, 2-5 шкоди, 0 точності, 3 енергії. 35% шанс збити ціль з ніг при влучанні. Якщо удар повністю промахується, 50% шанс, що ви самі втрачаєте рівновагу.
moth_vision.weapon.wooden_log.knockdown=🪵|{0} вгамселює колодою {1}, збиваючи його з ніг!
moth_vision.weapon.wooden_log.stumble=🪵|{0} замахується, промахується і втрачає рівновагу!
moth_vision.weapon.mimicry.vertical.name=Great Split: Vertical
moth_vision.weapon.mimicry.vertical.charge=⚔️|{0} замахується вертикальним ударом на {1}!
moth_vision.weapon.mimicry.horizontal.name=Great Split: Horizontal
moth_vision.weapon.mimicry.horizontal.charge=⚔️|{0} замахується розмашистим горизонтальним ударом!
moth_vision.weapon.mimicry.ego.name=E.G.O.
moth_vision.weapon.mimicry.ego.text=🩸|{0} вивільняє E.G.O.! Броня наростає, реагуючи на кожну рану.
moth_vision.weapon.mimicry.ego_end=🩸|E.G.O. {0} згасає.
moth_vision.item.flare.name=Сигнальна ракета
moth_vision.item.flare.text_ally=🔦|{0} запускає сигнальну ракету над {1}. Щось наближається.
moth_vision.item.flare.granted=🎁|{0} знаходить: {1}!
moth_vision.item.flare.text_enemy=🔦|{0} влучає в {1} ракетою, підпалюючи і замикаючи нерви!
moth_vision.weapon.hand_bandage.name=Пов'язка на руку
moth_vision.weapon.hand_bandage.description=Ближній бій, 1-3 шкоди, 2 точності, 2 енергії. Кожне влучання розпочинає або продовжує Комбо: поки воно активне, ви отримуєте +1 кубик атаки (і ще по кубику за кожні 2 стеки комбо) та +1 енергію наприкінці ходу. Комбо триває 2 ходи і оновлюється при кожному влучанні.
moth_vision.state.combo.start=💥|{0} починає комбо!
moth_vision.state.combo.continue=💥|{0} продовжує серію комбо з {1} ударів!
moth_vision.state.combo.end=🖐|{0} завершив серію комбо з {1} ударів!
moth_vision.weapon.pen.name=Ручка
moth_vision.weapon.pen.description=Ближній бій, 3 куби, 2 точності, 2 енергії, без бонусу шкоди. Відновлює енергію, коли завдана й отримана шкода рівні.
moth_vision.weapon.pen.text=🖊|{0} урівнює обмін із {1}.
