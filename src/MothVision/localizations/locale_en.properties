moth_vision.state.aflame.cauterize=🔥|The heat cauterizes {0}'s wound, stopping the bleeding!
moth_vision.weapon.chained_dagger.name=Chained Dagger
moth_vision.weapon.chained_dagger.description=A melee weapon. Its special attack is ranged and can swap your weapon with the target's — chance scales with the target's missing energy, guaranteed if they're reloading. 3-turn cooldown.
moth_vision.weapon.chained_dagger.action.name=Swap
moth_vision.weapon.chained_dagger.action.text=⛓|{0} yanks the chain, swapping weapons with {1}!
moth_vision.weapon.chained_dagger.action_miss=⛓|{0}'s chain whips at {1}, but the swap doesn't take!
moth_vision.weapon.guitar.name=Guitar
moth_vision.weapon.guitar.description=Melee, 4 cubes, 2 accuracy, 2 energy, no damage bonus. Active — Feedback (4 energy, can't be used below that, 5-turn cooldown): targets an enemy; if they attack you this turn, negates the damage and counters with your own attack plus their blocked damage as bonus. If what hit you was one of their special attacks (not a basic swing), you also get a free copy of it back at them. If they don't attack you at all, Feedback is just a basic attack instead.
moth_vision.weapon.guitar.feedback.name=Feedback
moth_vision.weapon.guitar.feedback.text=🎸|{0} winds up to answer {1}!
moth_vision.weapon.guitar.feedback.effect=🎸|{0} counters {1}!
moth_vision.weapon.guitar.feedback.effect_reflect=🎸|{0} counters {1} and uses their trick against them!
moth_vision.skill.clock_o_destiny.name=Clock'o Destiny
moth_vision.skill.clock_o_destiny.description=Activate to freeze everyone in the battle — yourself included — in time for a random 7 to 10 turns. 17-turn cooldown.
moth_vision.skill.clock_o_destiny.action.name=Turn the hourglass
moth_vision.skill.clock_o_destiny.text=⏳|{0} turns the hourglass! Everyone is frozen in time for {1} turns.
moth_vision.skill.embargo.name=Embargo
moth_vision.skill.embargo.description=Enemies cannot use items until you use one of your own. If an enemy also has Embargo, it has no effect.
moth_vision.skill.embargo.lifted=🚫|{0} uses an item, lifting the embargo!
moth_vision.skill.embargo.negated=🚫|{0}'s Embargo is negated by the mutual pick!
moth_vision.skill.fight_or_flight.name=Fight or Flight
moth_vision.skill.fight_or_flight.description=Costs 1 energy and your turn, 5-turn cooldown. Track one enemy: if they attack you and you can dodge, you're forced to dodge (or take a weaker defensive reaction if Dodge is on cooldown); otherwise you're forced to counter-attack them.
moth_vision.skill.fight_or_flight.action.name=Track
moth_vision.skill.fight_or_flight.text=👁|{0}'s pupils dilate, tracking {1}'s every move.
moth_vision.skill.fight_or_flight.weak_roll=💨|{0} can't dodge in time and flinches instead, bracing for the hit!
moth_vision.skill.barbeque.name=Barbeque
moth_vision.skill.barbeque.description=20-turn cooldown. Choose an enemy and enjoy a juicy, fresh barbecue with them on the grill you brought along. Stuns both of you for 5 turns, but restores 1 HP and 1 energy every turn.
moth_vision.skill.barbeque.action.name=Barbeque
moth_vision.skill.barbeque.text=🍖|{0} fires up the grill and invites {1} to a juicy, fresh barbecue! Both are stunned for 5 turns.
moth_vision.skill.barbeque.tick=🍖|{0} savors the barbecue, recovering 1 HP and 1 energy.
moth_vision.skill.lobotomy.name=Lobotomy
moth_vision.skill.lobotomy.description=Grants a Needle that can be instantly used on yourself or an ally. The needled target permanently loses 1 attack energy cost, but is forced to always attack (or reload, if out of energy) and their attacks are redirected to a random enemy — themselves if none are in reach.
moth_vision.item.needle.name=Needle
moth_vision.item.needle.text=🪛|{0} rewires his brain in a funny way.
moth_vision.item.needle.text_self=💉|{0} sticks the needle into themselves!
moth_vision.weapon.hand_bandage.name=Hand Bandage
moth_vision.weapon.hand_bandage.description=Melee, 1-3 damage, 2 accuracy, 2 energy. Every hit starts or extends a Combo: while active, gain +1 attack die (plus another die for every 2 combo stacks) and +1 energy at the end of each turn. Combo lasts 2 turns and refreshes on every hit.
moth_vision.state.combo.start=💥|{0} started the combo!
moth_vision.state.combo.continue=💥|{0} continues his {1}-hit combo streak!
moth_vision.state.combo.end=🖐|{0} ended his {1}-hit combo!
moth_vision.weapon.mimicry.name=Mimicry
moth_vision.weapon.mimicry.description=Melee, 2-3 damage, 2 accuracy, 2 energy. Every 3rd hit knocks the target down and has a 25% chance to cause bleeding (the counter only resets on reload). Onrush: rush and strike a distant enemy for +2 damage (3 energy, 5-turn cooldown, self-stuns 1 turn on a miss). Great Split: Vertical: charge for a turn, then slash for +4 bonus damage and stun the target 1 turn (5 energy, 5-turn cooldown, stuns you 2 turns if the slash misses). Once you've dealt 25 total damage with this weapon, E.G.O. becomes available: grants 2 armor for 4 turns, extended and strengthened by every point of HP you lose while active, and unlocks Great Split: Horizontal — a charged strike hitting 2 enemies for 18 damage each plus bleeding (5 energy, 15-turn cooldown, stuns you up to 6 turns based on how many of the two hits miss).
moth_vision.weapon.mimicry.knockdown=🥊|{0} knocks {1} down with a {2}-hit combo!
moth_vision.weapon.mimicry.onrush.name=Onrush
moth_vision.weapon.mimicry.onrush.hit=💨|{0} rapidly closes the distance between {1}, ramming them! Dealt {2} damage.
moth_vision.weapon.mimicry.onrush.miss=💨|{0} rapidly closes the distance between {1}, but the ram misses completely, stumbling!
moth_vision.weapon.mimicry.horizontal.warning=⚠️|{0} are about to experience a devastating blow!
moth_vision.weapon.turbo_gloves.name=Turbo-Gloves
moth_vision.weapon.turbo_gloves.description=Melee, 3 cubes, 2 accuracy, 2 energy. Hand Bandage's Combo, but lasting 3 turns instead of 2 (+1 die per 2 stacks, +1 energy/turn, refreshes on every hit), plus a weaker Brass Knuckles effect (hitting a reloading target drains 3 energy). Combo also builds when anyone else hits this weapon's last target. Uppercut (1 energy, 6-turn cooldown): adds a die per Combo stack instead of per 2, 10% chance per stack to stun on a hit. Punch Barrage (1 energy, 6-turn cooldown): throws one 1-2 damage punch per Combo stack.
moth_vision.weapon.turbo_gloves.combo_start=⬆️💥|{0} starts throwing combos!
moth_vision.weapon.turbo_gloves.combo_continue=⬆️💥|{0} continues his {1}-hit combo streak!
moth_vision.weapon.turbo_gloves.combo_end=⛔️|{0}'s {1}-hit combo streak ends.
moth_vision.weapon.turbo_gloves.reload_punish=🥊|{0} gets caught mid-reload and staggers!
moth_vision.weapon.turbo_gloves.uppercut.name=Uppercut
moth_vision.weapon.turbo_gloves.uppercut.stun=💥|{0}'s uppercut rattles {1}, stunning them!
moth_vision.weapon.turbo_gloves.barrage.name=Punch Barrage
moth_vision.weapon.turbo_gloves.barrage.text=👊|{0} unloads a {2}-punch barrage on {1}!
moth_vision.weapon.turbo_gloves.block.name=Block
moth_vision.weapon.turbo_gloves.block.text=✋|{0} braces to block!
moth_vision.weapon.turbo_gloves.block.text_targeted=✋|{0} braces to block for {1}!
moth_vision.weapon.turbo_gloves.block.effect=✋|{0} blocks the hit and capitalizes on it!
moth_vision.weapon.turbo_gloves.block.vain=⛔️|{0}'s block goes unused — the combo fizzles.
moth_vision.weapon.wooden_log.name=Wooden Log
moth_vision.weapon.wooden_log.description=Melee, 2-5 damage, 0 accuracy, 3 energy. 35% chance to knock the target off balance on a hit. If the swing misses entirely, 50% chance you knock yourself off balance instead.
moth_vision.weapon.wooden_log.knockdown=🪵|{0} clocks {1} with the log, knocking them off balance!
moth_vision.weapon.wooden_log.stumble=🪵|{0} swings wildly, misses, and stumbles off balance!
moth_vision.weapon.mimicry.vertical.name=Great Split: Vertical
moth_vision.weapon.mimicry.vertical.charge=⚔️|{0} winds up a vertical slash at {1}!
moth_vision.weapon.mimicry.horizontal.name=Great Split: Horizontal
moth_vision.weapon.mimicry.horizontal.charge=⚔️|{0} winds up a sweeping horizontal slash!
moth_vision.weapon.mimicry.ego.name=E.G.O.
moth_vision.weapon.mimicry.ego.text=🩸|{0} unleashes E.G.O.! Armor surges, reacting to every wound.
moth_vision.weapon.mimicry.ego_end=🩸|{0}'s E.G.O. fades.
moth_vision.item.flare.name=Flare
moth_vision.item.flare.text_ally=🔦|{0} pops a flare over {1}. Something's inbound.
moth_vision.item.flare.granted=🎁|{0} finds: {1}!
moth_vision.item.flare.text_enemy=🔦|{0} hits {1} with a flare, setting them alight and frying their nerves!
moth_vision.weapon.pen.name=Pen
moth_vision.weapon.pen.description=Melee, 3 cubes, 2 accuracy, 2 energy, no damage bonus. Passive: if you and an enemy deal each other exactly the same amount of damage this turn, every second time that happens the hit against you is canceled.
moth_vision.weapon.pen.text=🪶|The turn goes down in {0}'s ledger.
