moth_vision.state.aflame.cauterize=🔥|Жар прижигает рану {0}, останавливая кровотечение!
moth_vision.weapon.chained_dagger.name=Кинжал на цепи
moth_vision.weapon.chained_dagger.description=Оружие ближнего боя. Спецатака дальнобойная и может поменять ваше оружие с оружием цели местами — шанс растёт с недостающей энергией цели, гарантирован при перезарядке. Откат 3 хода.
moth_vision.weapon.chained_dagger.action.name=Обмен
moth_vision.weapon.chained_dagger.action.text=⛓|{0} дёргает цепь, меняясь оружием с {1}!
moth_vision.weapon.chained_dagger.action_miss=⛓|Цепь {0} хлещет по {1}, но обмен не удался!
moth_vision.weapon.guitar.name=Гитара
moth_vision.weapon.guitar.description=Ближний бой, 4 куба, 2 точности, 2 энергии, без бонуса урона. Активность — Фидбэк (4 энергии, нельзя использовать при меньшем запасе, откат 5 ходов): выбирает врага; если тот атакует в этот ход, урон обнуляется и наносится ответный удар этим оружием + заблокированный урон как бонус. Если по вам ударили одной из его особых атак (не обычным свингом), вы также получаете бесплатную копию этой атаки против него. Если враг вас не атаковал, Фидбэк становится обычной атакой.
moth_vision.weapon.guitar.feedback.name=Feedback
moth_vision.weapon.guitar.feedback.text=🎸|{0} готовится ответить {1}!
moth_vision.weapon.guitar.feedback.effect=🎸|{0} контратакует {1}!
moth_vision.weapon.guitar.feedback.effect_reflect=🎸|{0} контратакует {1} и использует против него его же приём!
moth_vision.skill.clock_o_destiny.name=Часы судьбы
moth_vision.skill.clock_o_destiny.description=Активируйте, чтобы заморозить во времени всех участников боя, включая себя, на случайные 7-10 ходов. Откат 17 ходов.
moth_vision.skill.clock_o_destiny.action.name=Перевернуть песочные часы
moth_vision.skill.clock_o_destiny.text=⏳|{0} переворачивает песочные часы! Все застывают во времени на {1} ходов.
moth_vision.skill.embargo.name=Эмбарго
moth_vision.skill.embargo.description=Враги не могут использовать предметы, пока вы не используете свой. Если у врага тоже есть Эмбарго, способность не действует.
moth_vision.skill.embargo.lifted=🚫|{0} использует предмет, снимая эмбарго!
moth_vision.skill.embargo.negated=🚫|Эмбарго {0} аннулируется взаимным выбором!
moth_vision.skill.fight_or_flight.name=Бей или беги
moth_vision.skill.fight_or_flight.description=Стоит 1 энергию и ваш ход, откат 5 ходов. Отслеживайте одного врага: если он атакует вас и вы можете увернуться, вы будете вынуждены увернуться (или совершить более слабую защитную реакцию, если уклонение на откате); иначе вы будете вынуждены контратаковать его.
moth_vision.skill.fight_or_flight.action.name=Отследить
moth_vision.skill.fight_or_flight.text=👁|Зрачки {0} расширяются, отслеживая действия {1}.
moth_vision.skill.fight_or_flight.weak_roll=💨|{0} не успевает увернуться и вместо этого вздрагивает, готовясь к удару!
moth_vision.skill.barbeque.name=Барбекю
moth_vision.skill.barbeque.description=Откат 20 ходов. Выберите врага и устройте с ним сочное свежее барбекю на принесённом гриле. Оглушает вас обоих на 5 ходов, но каждый ход восстанавливает 1 ХП и 1 энергию.
moth_vision.skill.barbeque.action.name=Барбекю
moth_vision.skill.barbeque.text=🍖|{0} разжигает гриль и приглашает {1} на сочное свежее барбекю! Оба оглушены на 5 ходов.
moth_vision.skill.barbeque.tick=🍖|{0} наслаждается барбекю, восстанавливая 1 ХП и 1 энергию.
moth_vision.skill.lobotomy.name=Лоботомия
moth_vision.skill.lobotomy.description=Дает Иглу, которую можно мгновенно применить на себя или союзника. У цели навсегда снижается стоимость атаки на 1 энергию, но она вынуждена всегда атаковать (или перезаряжаться, если нет энергии), причем атака перенаправляется на случайного врага — на себя, если врагов в досягаемости нет.
moth_vision.item.needle.name=Игла
moth_vision.item.needle.text=🪛|{0} забавно перепрошивает себе мозги.
moth_vision.item.needle.text_self=💉|{0} втыкает иглу в себя!
moth_vision.item.flare.name=Сигнальная ракета
moth_vision.item.flare.text_ally=🎇|{0} зажигает сигнальную ракету возле {1}! Помощь прибудет через {2}.
moth_vision.item.flare.granted=📦|{0} получает припасы: {1}.
moth_vision.item.flare.text_enemy=🎆|{0} кидает сигнальную ракету в {1}, обжигая и ослепляя вспышкой!
moth_vision.weapon.hand_bandage.name=Бинт на руку
moth_vision.weapon.hand_bandage.description=Ближний бой, 1-3 урона, 2 точности, 2 энергии. Каждое попадание начинает или продлевает Комбо: пока оно активно, вы получаете +1 кубик атаки (и ещё по кубику за каждые 2 стака комбо) и +1 энергию в конце хода. Комбо длится 2 хода и обновляется при каждом попадании.
moth_vision.state.combo.start=💥|{0} начинает комбо!
moth_vision.state.combo.continue=💥|{0} продолжает серию комбо из {1} ударов!
moth_vision.state.combo.end=🖐|{0} закончил серию комбо из {1} ударов!
moth_vision.weapon.mimicry.name=Мимикрия
moth_vision.weapon.mimicry.description=Ближний бой, 2-3 урона, 2 точности, 2 энергии. Каждый 3-й удар сбивает цель с ног и с 25% шансом вызывает кровотечение (счетчик сбрасывается только перезарядкой). Onrush: рывок к дальнему врагу с ударом +2 урона (3 энергии, откат 5 ходов, при промахе оглушает себя на 1 ход). Great Split: Vertical: замах на 1 ход, затем удар с +4 бонусного урона и оглушением цели на 1 ход (5 энергии, откат 5 ходов, при промахе оглушает себя на 2 хода). После 25 суммарного урона этим оружием становится доступен E.G.O.: дает 2 брони на 4 хода, продлевается и усиливается с каждой потерянной HP, и открывает Great Split: Horizontal — заряженный удар по 2 врагам, по 18 урона каждому плюс кровотечение (5 энергии, откат 15 ходов, оглушает себя до 6 ходов в зависимости от числа промахов).
moth_vision.weapon.mimicry.knockdown=🥊|{0} сбивает {1} с ног комбо из {2} ударов!
moth_vision.weapon.mimicry.onrush.name=Onrush
moth_vision.weapon.mimicry.onrush.hit=💨|{0} стремительно сокращает дистанцию до {1} и таранит его! Нанесено {2} урона.
moth_vision.weapon.mimicry.onrush.miss=💨|{0} стремительно сокращает дистанцию до {1}, но таран полностью промахивается, и {0} спотыкается!
moth_vision.weapon.mimicry.horizontal.warning=⚠️|{0} сейчас испытают на себе сокрушительный удар!
moth_vision.weapon.turbo_gloves.name=Турбо-перчатки
moth_vision.weapon.turbo_gloves.description=Ближний бой, 3 куба, 2 точности, 2 энергии. Комбо от Бинта на руку, но длится 3 хода вместо 2 (+1 кубик за каждые 2 стака, +1 энергия в ход, обновляется при каждом попадании), плюс более слабый эффект Кастета (попадание по перезаряжающейся цели снимает 3 энергии). Комбо также растет, если кто-то другой бьет последнюю цель этого оружия. Uppercut (1 энергия, откат 6 ходов): дает кубик за каждый стак комбо вместо каждых двух, 10% шанс оглушить за каждый стак при попадании. Punch Barrage (1 энергия, откат 6 ходов): наносит один удар 1-2 урона за каждый стак комбо.
moth_vision.weapon.turbo_gloves.combo_start=⬆️💥|{0} начинает серию ударов!
moth_vision.weapon.turbo_gloves.combo_continue=⬆️💥|{0} продолжает серию комбо из {1} ударов!
moth_vision.weapon.turbo_gloves.combo_end=⛔️|Серия комбо {0} из {1} ударов заканчивается.
moth_vision.weapon.turbo_gloves.reload_punish=🥊|{0} застигнут врасплох во время перезарядки и спотыкается!
moth_vision.weapon.turbo_gloves.uppercut.name=Uppercut
moth_vision.weapon.turbo_gloves.uppercut.stun=💥|Апперкот {0} оглушает {1}!
moth_vision.weapon.turbo_gloves.barrage.name=Punch Barrage
moth_vision.weapon.turbo_gloves.barrage.text=👊|{0} обрушивает на {1} серию из {2} ударов!
moth_vision.weapon.turbo_gloves.block.name=Блок
moth_vision.weapon.turbo_gloves.block.text=✋|{0} готовится блокировать удар!
moth_vision.weapon.turbo_gloves.block.text_targeted=✋|{0} готовится прикрыть блоком {1}!
moth_vision.weapon.turbo_gloves.block.effect=✋|{0} блокирует удар и использует момент!
moth_vision.weapon.turbo_gloves.block.vain=⛔️|Блок {0} не пригодился — комбо срывается.
moth_vision.weapon.wooden_log.name=Бревно
moth_vision.weapon.wooden_log.description=Ближний бой, 2-5 урона, 0 точности, 3 энергии. 35% шанс сбить цель с ног при попадании. Если удар полностью промахивается, 50% шанс, что вы сами теряете равновесие.
moth_vision.weapon.wooden_log.knockdown=🪵|{0} впечатывает бревно в {1}, сбивая его с ног!
moth_vision.weapon.wooden_log.stumble=🪵|{0} размахивается, промахивается и теряет равновесие!
moth_vision.weapon.mimicry.vertical.name=Great Split: Vertical
moth_vision.weapon.mimicry.vertical.charge=⚔️|{0} замахивается вертикальным ударом на {1}!
moth_vision.weapon.mimicry.horizontal.name=Great Split: Horizontal
moth_vision.weapon.mimicry.horizontal.charge=⚔️|{0} замахивается размашистым горизонтальным ударом!
moth_vision.weapon.mimicry.ego.name=E.G.O.
moth_vision.weapon.mimicry.ego.text=🩸|{0} высвобождает E.G.O.! Броня нарастает, реагируя на каждую рану.
moth_vision.weapon.mimicry.ego_end=🩸|E.G.O. {0} угасает.
moth_vision.weapon.pen.name=Ручка
moth_vision.weapon.pen.description=Ближний бой, 3 куба, 2 точности, 2 энергии, без бонуса урона. Пассивка: если вы и враг наносите друг другу одинаковый урон в этот ход, то каждый второй раз его удар по вам аннулируется.
moth_vision.weapon.pen.text=🪶|Ход записан в счёт {0}.
