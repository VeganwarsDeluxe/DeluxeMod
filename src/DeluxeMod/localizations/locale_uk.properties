deluxe.weapon.mimicry.name=Мімікрія
deluxe.weapon.mimicry.description=Ближній бій, 2-3 шкоди, 2 точності, 2 енергії. Кожен 3-й удар збиває ціль з ніг і з 25% шансом викликає кровотечу (лічильник скидається лише перезарядкою). Onrush: ривок до далекого ворога з ударом +2 шкоди (3 енергії, відкат 5 ходів, при промаху оглушує себе на 1 хід). Great Split: Vertical: замах на 1 хід, потім удар з +4 бонусної шкоди й оглушенням цілі на 1 хід (5 енергії, відкат 5 ходів, при промаху оглушує себе на 2 ходи). Після 25 сумарної шкоди цією зброєю стає доступний E.G.O.: дає 2 броні на 4 ходи, продовжується і посилюється з кожним втраченим HP, і відкриває Great Split: Horizontal — заряджений удар по 2 ворогах, по 18 шкоди кожному плюс кровотеча (5 енергії, відкат 15 ходів, оглушує себе до 6 ходів залежно від кількості промахів).
