deluxe.skill.fight_or_flight.name=Бий або біжи
deluxe.skill.fight_or_flight.description=Коштує 1 енергію та ваш хід, відкат 5 ходів. Відстежуйте одного ворога: якщо він атакує вас і ви можете ухилитися, вас змусить ухилитися (або здійснити слабшу захисну реакцію, якщо ухилення на відкаті); інакше вас змусить контратакувати його.
