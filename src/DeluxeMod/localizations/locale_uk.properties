deluxe.weapon.turbo_gloves.name=Турбо-рукавички
deluxe.weapon.turbo_gloves.description=Ближній бій, 3 куби, 2 точності, 2 енергії. Комбо від Пов'язки на руку, але триває 3 ходи замість 2 (+1 кубик за кожні 2 стеки, +1 енергія за хід, оновлюється при кожному влучанні), плюс слабший ефект Кастета (влучання по цілі, що перезаряджається, знімає 3 енергії). Комбо також росте, якщо хтось інший влучає в останню ціль цієї зброї. Uppercut (1 енергія, відкат 6 ходів): дає кубик за кожен стек комбо замість кожних двох, 10% шанс оглушити за кожен стек при влучанні. Punch Barrage (1 енергія, відкат 6 ходів): завдає один удар 1-2 шкоди за кожен стек комбо.
