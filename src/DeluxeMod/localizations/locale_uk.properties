deluxe.skill.barbeque.description=Відкат 20 ходів. Оберіть ворога і влаштуйте з ним соковите свіже барбекю на принесеному грилі. Оглушує вас обох на 5 ходів, але щохода відновлює 1 ХП та 1 енергію.
