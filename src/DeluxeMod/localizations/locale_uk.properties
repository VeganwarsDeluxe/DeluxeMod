deluxe.skill.lobotomy.description=Дає Голку, яку можна миттєво застосувати на себе або союзника. Ціль назавжди втрачає 1 енергію вартості атаки, але змушена завжди атакувати (або перезаряджатися, якщо немає енергії), а її атака спрямовується на випадкового ворога — на себе, якщо ворогів у межах досяжності немає.
