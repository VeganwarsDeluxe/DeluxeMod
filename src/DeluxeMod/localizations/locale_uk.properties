deluxe.weapon.throwing_sickles.description=Гібрид ближнього/дальнього бою. Дальній: 1-3 шкоди, 3 енергії, 0 точності; промах повертає серп, влучання треба підібрати. Ближній: 1-3 шкоди, 2 енергії, 1 точність; 20% подвійної атаки за 3 енергії, якщо обидва серпи в руках.
